                  name, _, ver = str(t).partition(":")
                  f.append(comp(name, ver, "httpx", where))
              if d.get("webserver"):
                  m = re.match(r"([^/ ]+)[/ ]?(.*)", str(d["webserver"]))
                  f.append(comp("Webserver " + m.group(1), m.group(2), "httpx (Server-Header)", where))
              if d.get("cdn_name"): f.append(comp("CDN " + str(d["cdn_name"]), "", "httpx", where))
          seen = set(); f = [x for x in f if not (x["title"] in seen or seen.add(x["title"]))]
          save("httpx", f)
          # katana: entdeckte Seiten
          try:
              urls = list(dict.fromkeys(l.strip() for l in open("reports/katana-urls.txt", encoding="utf-8", errors="replace") if l.strip()))
          except OSError: urls = []
          if urls:
              withp = [u for u in urls if "?" in u]
              save("katana", [{"title": "Entdeckte Seiten und Endpunkte (Katana)", "description": "Katana hat %d URLs gefunden, davon %d mit Parametern." % (len(urls), len(withp)),
                               "severity": "info", "url": "https://%s" % T, "evidence": "Anzahl URLs: %d\nMit Parametern: %d\n\n%s" % (len(urls), len(withp), "\n".join(urls[:150]))}])
          # wapiti
          f = []
          try:
              w = json.load(open("reports/wapiti-raw.json", encoding="utf-8", errors="replace"))
