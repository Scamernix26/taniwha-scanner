                      f.append({"title": "%s (Wapiti)" % cat, "description": str(v.get("info") or cat), "severity": lvl.get(v.get("level"), "medium"),
                                "url": "https://%s%s" % (T, v.get("path") or "") if str(v.get("path") or "").startswith("/") else (v.get("path") or "https://%s" % T),
                                "parameter": v.get("parameter") or None,
                                "evidence": "Anfrage:\n%s\n\nTest: %s\nParameter: %s\nRegelwerk: %s" % (v.get("http_request") or "", v.get("curl_command") or v.get("info"), v.get("parameter"), ", ".join(v.get("wstg") or []))})
              for cat, arr in (w.get("anomalies") or {}).items():
                  for v in arr or []:
                      f.append({"title": "%s (Wapiti, Auffälligkeit)" % cat, "description": str(v.get("info") or cat), "severity": "low", "url": v.get("path") or None, "parameter": v.get("parameter") or None,
                                "evidence": "Anfrage:\n%s\n\n%s" % (v.get("http_request") or "", v.get("info") or "")})
          except Exception: pass
          save("wapiti", f)
          # arjun
          f = []
          try:
              a = json.load(open("reports/arjun-raw.json", encoding="utf-8", errors="replace"))
              items = a.items() if isinstance(a, dict) else [(x.get("url"), x) for x in a if isinstance(x, dict)]
              for url, v in items:
                  ps = v.get("params") if isinstance(v, dict) else v
                  if ps:
                      f.append({"title": "Versteckte Parameter entdeckt", "description": "Arjun hat Parameter gefunden, die nirgends verlinkt sind, aber vom Server ausgewertet werden.",
                                "severity": "info", "url": str(url), "evidence": "Seite: %s\nParameter: %s" % (url, ", ".join(map(str, ps)))})
          except Exception: pass
