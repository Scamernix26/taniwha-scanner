                                    "evidence": "Datei: %s\nBibliothek: %s %s\n\n%s" % (uri, name, ver, "\n".join("- [%s] %s %s" % (v.get("severity"), (v.get("identifiers") or {}).get("summary") or "", ", ".join((v.get("identifiers") or {}).get("CVE", []))) for v in vs[:15]))})
          save("retirejs", f)
          # wpscan
          f = []
          try:
