                        "url": "%s:%s" % (ip, port), "evidence": "Host: %s\nIP: %s\nPort: %s\nMethode: TCP-Connect" % (d.get("host") or T, ip, port)})
          save("naabu", f)
          # sslyze: TLS-Schwächen
