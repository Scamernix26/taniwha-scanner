# Place at .github/workflows/scan.yml in the <org>/security-runner repository.
# Repository secrets: PLATFORM_INGEST_URL (…/api/public/ingest-results), RUNNER_INGEST_SECRET
name: Security Scan
on:
  workflow_dispatch:
    inputs:
      scan_id: { required: true }
      target_domain: { required: true }
      tools: { required: true } # comma separated: zap,nuclei,testssl,...
      callback_url: { required: false }

jobs:
  scan:
    runs-on: self-hosted
    env:
      INGEST_URL: ${{ inputs.callback_url || secrets.PLATFORM_INGEST_URL }}
      INGEST_SECRET: ${{ secrets.RUNNER_INGEST_SECRET }}
      SCAN_ID: ${{ inputs.scan_id }}
      TARGET: ${{ inputs.target_domain }}
      TOOLS: ${{ inputs.tools }}
    steps:
      - name: Validate inputs (no shell injection)
        run: |
          [[ "$TARGET" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo "invalid target"; exit 1; }
          [[ "$SCAN_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "invalid scan id"; exit 1; }
          [[ "$TOOLS" =~ ^[a-z,]+$ ]] || { echo "invalid tools"; exit 1; }

      - name: Status running
        run: |
          curl -fsS -X POST "$INGEST_URL" -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" \
            -d "{\"scan_id\":\"$SCAN_ID\",\"status\":\"running\"}"

      - name: Run tools
        run: |
          mkdir -p reports
          has() { [[ ",$TOOLS," == *",$1,"* ]]; }
          ev() { # ev <tool> <level> <message>  – live progress for the Taniwha UI
            jq -nc --arg s "$SCAN_ID" --arg t "$1" --arg l "$2" --arg m "$3" '{scan_id:$s,tool:$t,level:$l,event:$m}' \
              | curl -sS -X POST "$INGEST_URL" -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" --data-binary @- >/dev/null || true
          }
          run() { # run <tool> <description> <command...>
            local t="$1" d="$2"; shift 2
            has "$t" || return 0
            ev "$t" info "Startet: $d"
            local s=$SECONDS
            if "$@"; then ev "$t" ok "Fertig nach $((SECONDS-s)) s"; else ev "$t" warn "Beendet mit Fehlercode nach $((SECONDS-s)) s"; fi
          }
          ev "" info "Scan-Rechner $(hostname) startet – Ziel $TARGET"
          run zap "ZAP Full-Scan (Spider + aktive Angriffe, max. 10 min Spider) auf https://$TARGET" docker run --rm -v "$PWD/reports:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py -t "https://$TARGET" -J zap-report.json -m 10
          run nuclei "Nuclei-Templates (critical/high/medium, 50 Req/s) gegen https://$TARGET" docker run --rm -v "$PWD/reports:/reports" projectdiscovery/nuclei:latest -u "https://$TARGET" -severity critical,high,medium -jsonl-export /reports/nuclei-report.json -rate-limit 50
          run nikto "Nikto Webserver-Prüfung auf https://$TARGET" docker run --rm -v "$PWD/reports:/reports" frapsoft/nikto -h "https://$TARGET" -Format json -output /reports/nikto-report.json
          run testssl "TLS/SSL-Konfiguration von $TARGET" docker run --rm -v "$PWD/reports:/reports" drwetter/testssl.sh:latest --jsonfile /reports/testssl-report.json "$TARGET"
          run trivy "Trivy Abhängigkeits-/Image-Scan" docker run --rm -v "$PWD:/repo" -v "$PWD/reports:/reports" aquasec/trivy:latest fs --format json --output /reports/trivy-report.json /repo
          run semgrep "Semgrep Code-Analyse" docker run --rm -v "$PWD:/src" -v "$PWD/reports:/reports" returntocorp/semgrep:latest semgrep scan --config auto --json --output /reports/semgrep-report.json /src
          run gitleaks "Gitleaks Secret-Suche" docker run --rm -v "$PWD:/repo" -v "$PWD/reports:/reports" zricethezav/gitleaks:latest detect --source /repo --report-format json --report-path /reports/gitleaks-report.json
          run depcheck "OWASP Dependency-Check" docker run --rm -v "$PWD:/src" -v "$PWD/reports:/reports" owasp/dependency-check:latest --project App --scan /src --format JSON --out /reports
          [ -f reports/dependency-check-report.json ] && mv reports/dependency-check-report.json reports/depcheck-report.json || true
          ev "" info "Alle Tools durchgelaufen – sende Reports"

      - name: Ingest reports
        run: |
          for f in reports/*-report.json; do
            [ -f "$f" ] || continue
            tool=$(basename "$f" -report.json)
            jq -cs --arg scan_id "$SCAN_ID" --arg tool "$tool" '{scan_id:$scan_id,tool:$tool,raw:.}' "$f" > payload.json || continue
            curl -fsS -X POST "$INGEST_URL" -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" --data-binary @payload.json || true
          done

      - name: Status done
        if: success()
        run: |
          curl -fsS -X POST "$INGEST_URL" -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" \
            -d "{\"scan_id\":\"$SCAN_ID\",\"status\":\"done\"}"

      - name: Status failed
        if: failure()
        run: |
          curl -fsS -X POST "$INGEST_URL" -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" \
            -d "{\"scan_id\":\"$SCAN_ID\",\"status\":\"failed\"}"
