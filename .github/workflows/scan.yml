                          summ = [str((v.get("identifiers") or {}).get("summary") or "") for v in vs]
                          f.append({"title": "Verwundbare JavaScript-Bibliothek: %s %s" % (name, ver), "description": "%s %s hat %d bekannte Schwachstellen. %s" % (name, ver, len(vs), " | ".join(s for s in summ if s)[:800]),
