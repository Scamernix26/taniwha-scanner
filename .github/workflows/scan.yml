                          sev = "critical" if top >= 9 else "high" if top >= 7 else "medium" if top >= 4 else ("high" if vulnerable else "low")
                          f.append({"title": "%s auf Port %s (Nmap)" % (sc.get("id"), port.get("portid")), "description": "Nmap-Skript %s meldet auf %s:%s mögliche Schwachstellen (%d CVE-Hinweise)." % (sc.get("id"), ip, port.get("portid"), len(cves)),
                                    "severity": sev, "url": "%s:%s" % (ip, port.get("portid")), "cve_ids": cves[:20], "evidence": "Skript: %s\nPort: %s/%s\n\n%s" % (sc.get("id"), port.get("portid"), port.get("protocol"), out[:3000])})
          except Exception: pass
          save("nmapvuln", f)
          PYEOF

      - name: Ingest reports
        if: always()
        run: |
          [ -f reports/dependency-check-report.json ] && mv reports/dependency-check-report.json reports/depcheck-report.json || true
          for f in reports/*-report.json; do
            [ -s "$f" ] || continue
            tool=$(basename "$f" -report.json)
            python3 - "$SCAN_ID" "$tool" "$f" > payload.json <<'PY' || continue
          import json, sys
          txt = open(sys.argv[3], encoding="utf-8", errors="replace").read()
          dec, i, vals = json.JSONDecoder(), 0, []
          while True:
              while i < len(txt) and txt[i].isspace(): i += 1
              if i >= len(txt): break
              v, i = dec.raw_decode(txt, i); vals.append(v)
          print(json.dumps({"scan_id": sys.argv[1], "tool": sys.argv[2], "raw": vals}))
          PY
            curl -fsS -X POST "$INGEST_URL" -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" --data-binary @payload.json || true
          done

      - name: Status done
        if: success()
        run: |
          curl -fsS -X POST "$INGEST_URL" -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" \
            -d "{\"scan_id\":\"$SCAN_ID\",\"status\":\"done\"}"

      - name: Status cancelled
        if: cancelled()
        run: |
          curl -fsS -X POST "$INGEST_URL" -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" \
            -d "{\"scan_id\":\"$SCAN_ID\",\"status\":\"cancelled\"}"

      - name: Status failed
        if: failure()
        run: |
          curl -fsS -X POST "$INGEST_URL" -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" \
            -d "{\"scan_id\":\"$SCAN_ID\",\"status\":\"failed\"}"
