      - name: Convert web-assessment reports to JSON
        if: always()
        run: |
          command -v python3 >/dev/null 2>&1 || exit 0
          python3 - <<'PYEOF'
          import json, os, re
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse
          T = os.environ.get("TARGET", "")
          def save(tool, items):
              if items:
                  json.dump({"findings": items}, open("reports/%s-report.json" % tool, "w"))
                  print("converted %d %s findings" % (len(items), tool))
          def comp(name, ver, src, where):
              n = (name or "").strip(); v = (ver or "").strip()
              return {"title": ("Komponente: %s %s" % (n, v)).strip(), "description": "Erkannt durch %s auf %s" % (src, where),
                      "severity": "info", "url": "https://%s" % T, "evidence": "Komponente: %s\nVersion: %s\nErkannt durch: %s\nFundstelle: %s" % (n, v or "unbekannt", src, where)}
          def jl(path):
              out = []
              try:
                  for line in open(path, encoding="utf-8", errors="replace"):
                      line = line.strip()
                      if line:
                          try: out.append(json.loads(line))
                          except ValueError: pass
              except OSError: pass
              return out
          # httpx: Technik-Inventar
          f = []
          for d in jl("reports/httpx-raw.json"):
