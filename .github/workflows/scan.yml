              if key in seen: continue
              seen.add(key)
              ok = bool(d.get("Verified"))
              f.append({"title": "Geleakter Schlüssel: %s%s (Trufflehog)" % (det, " – gültig!" if ok else ""), "description": "In öffentlich abrufbarem Code wurde ein %s-Zugangsschlüssel gefunden.%s" % (det, " Trufflehog hat bestätigt, dass er funktioniert – sofort sperren und neu erzeugen." if ok else " Ob er noch gültig ist, konnte nicht bestätigt werden."),
