# Place at .github/workflows/scan.yml in the scanner repository.
# Repository secrets: PLATFORM_INGEST_URL (…/api/public/ingest-results), RUNNER_INGEST_SECRET, optional OPENVAS_PASSWORD
name: Security Scan
run-name: Scan ${{ inputs.scan_id }} – ${{ inputs.target_domain }}
on:
  workflow_dispatch:
    inputs:
      scan_id: { required: true }
      target_domain: { required: true }
      tools: { required: true } # comma separated: zap,nuclei,testssl,...
      callback_url: { required: false }

jobs:
  scan:
    runs-on: self-hosted
    env:
      INGEST_URL: ${{ inputs.callback_url || secrets.PLATFORM_INGEST_URL }}
      INGEST_SECRET: ${{ secrets.RUNNER_INGEST_SECRET }}
      SCAN_ID: ${{ inputs.scan_id }}
      TARGET: ${{ inputs.target_domain }}
      TOOLS: ${{ inputs.tools }}
      OPENVAS_PASSWORD: ${{ secrets.OPENVAS_PASSWORD }}
      WPSCAN_API_TOKEN: ${{ secrets.WPSCAN_API_TOKEN }}
    steps:
      - name: Validate inputs (no shell injection)
        run: |
          [[ "$TARGET" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo "invalid target"; exit 1; }
          [[ "$SCAN_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "invalid scan id"; exit 1; }
          [[ "$TOOLS" =~ ^[a-z,]+$ ]] || { echo "invalid tools"; exit 1; }

      - name: Status running
        run: |
          rm -rf reports && mkdir -p reports
          curl -fsS -X POST "$INGEST_URL" -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" \
            -d "{\"scan_id\":\"$SCAN_ID\",\"status\":\"running\"}"

      - name: Run tools
        run: |
          has() { [[ ",$TOOLS," == *",$1,"* ]]; }
          ev() { # ev <tool> <level> <message>  – live progress for the Taniwha UI
            python3 -c 'import json,sys;print(json.dumps({"scan_id":sys.argv[1],"tool":sys.argv[2],"level":sys.argv[3],"event":sys.argv[4][:500]}))' "$SCAN_ID" "$1" "$2" "$3" \
              | curl -sS -X POST "$INGEST_URL" -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" --data-binary @- >/dev/null || true
          }
          run() { # run <tool> <description> <docker args...>  – containers are named so a cancel can stop them
            local t="$1" d="$2"; shift 2
            has "$t" || return 0
            ev "$t" info "Startet: $d"
            mkdir -p reports/logs
            local s=$SECONDS rc=0
            echo "\$ docker run --rm --name taniwha-$SCAN_ID-$t $*" > "reports/logs/$t.log"
            docker run --rm --name "taniwha-$SCAN_ID-$t" "$@" >> "reports/logs/$t.log" 2>&1 || rc=$?
            local dur=$((SECONDS-s))
            if [ $rc -eq 0 ]; then ev "$t" ok "Fertig nach $dur s"; elif [ "$t" = zap ] && [ $rc -le 2 ]; then ev "$t" ok "Fertig nach $dur s (ZAP-Code $rc = Auffälligkeiten gefunden, kein Fehler)"; else ev "$t" warn "Beendet mit Fehlercode $rc nach $dur s"; fi
            runlog "$t" "docker run $*" "$rc" "$dur"
          }
          runlog() { # runlog <tool> <command> <exit> <seconds>  – full server log for the Taniwha UI
            python3 - "$SCAN_ID" "$1" "$2" "$3" "$4" "reports/logs/$1.log" <<'PY' \
              | curl -sS -X POST "$INGEST_URL" -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" --data-binary @- >/dev/null || true
          import json, re, sys
          sid, tool, cmd, rc, dur, path = sys.argv[1:7]
          try: log = open(path, encoding="utf-8", errors="replace").read()
          except OSError: log = ""
          log = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", log)
          if len(log) > 190000: log = log[:40000] + "\n\n… (gekürzt) …\n\n" + log[-150000:]
          print(json.dumps({"scan_id": sid, "tool": tool, "run": {"command": cmd[:4000], "exit_code": int(rc), "duration_s": int(dur), "log": log}}))
          PY
          }
          ev "" info "Scan-Rechner $(hostname) startet – Ziel $TARGET"
          # Wortliste für ffuf vorbereiten (einmalig pro Lauf)
          WLIST="$PWD/reports/seclists-common.txt"
          [ -s "$WLIST" ] || curl -fsSL -o "$WLIST" "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt" || true
          run zap "ZAP Full-Scan (Spider + aktive Angriffe, max. 10 min Spider) auf https://$TARGET" -v "$PWD/reports:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py -t "https://$TARGET" -J zap-report.json -m 10
          run nuclei "Nuclei-Templates (critical/high/medium, 50 Req/s) gegen https://$TARGET" -v "$PWD/reports:/reports" projectdiscovery/nuclei:latest -u "https://$TARGET" -severity critical,high,medium -jsonl-export /reports/nuclei-report.json -rate-limit 50 -stats -si 30
          # frapsoft/nikto (2.1.x) kennt kein JSON – CSV schreiben und in das Taniwha-Format umrechnen
          run nikto "Nikto Webserver-Prüfung auf https://$TARGET" -v "$PWD/reports:/reports" frapsoft/nikto -h "https://$TARGET" -Format csv -output /reports/nikto-report.csv
          if [ -s reports/nikto-report.csv ]; then
            python3 - reports/nikto-report.csv > reports/nikto-report.json <<'PY' || true
          import csv, json, sys
          out = []
          for r in csv.reader(open(sys.argv[1], encoding="utf-8", errors="replace")):
              if len(r) < 7 or not r[6].strip(): continue
              host, ip, port, nid, method, uri, msg = r[:7]
              url = f"https://{host}{uri}" if uri.startswith("/") else (uri or f"https://{host}")
              out.append({"title": msg[:300], "description": msg, "severity": "low", "url": url,
                          "evidence": f"Anfrage: {method} {url}\nServer: {ip}:{port}\nNikto-ID: {nid}\nMeldung: {msg}"})
          print(json.dumps({"findings": out}))
          PY
          fi
          run testssl "TLS/SSL-Konfiguration von $TARGET" -v "$PWD/reports:/reports" drwetter/testssl.sh:latest --jsonfile /reports/testssl-report.json "$TARGET"
          run ffuf "ffuf Verzeichnis-Entdeckung (SecLists common.txt) auf https://$TARGET" -v "$PWD/reports:/reports" trickest/ffuf -u "https://$TARGET/FUZZ" -w /reports/seclists-common.txt -ac -t 20 -timeout 10 -of json -o /reports/ffuf-report.json
          # --- Web-Assessment: Technik-Inventar, Seitenerkundung, zweiter Vollscanner, XSS, Parameter, JS-Bibliotheken, WordPress ---
          run httpx "httpx Technik-Erkennung (Webserver, Frameworks, CDN) auf https://$TARGET" -v "$PWD/reports:/reports" projectdiscovery/httpx:latest -u "https://$TARGET" -td -server -title -ip -cdn -silent -json -o /reports/httpx-raw.json
          run katana "Katana Seitenerkundung (Tiefe 3, inkl. JavaScript) auf https://$TARGET" -v "$PWD/reports:/reports" projectdiscovery/katana:latest -u "https://$TARGET" -d 3 -jc -c 5 -rl 50 -silent -o /reports/katana-urls.txt
          run wapiti "Wapiti Webanwendungs-Scan (max. 15 min) auf https://$TARGET" -v "$PWD/reports:/reports" cyberwatch/wapiti -u "https://$TARGET" -f json -o /reports/wapiti-raw.json --flush-session --max-scan-time 900
          run arjun "Arjun sucht versteckte Parameter auf https://$TARGET" -v "$PWD/reports:/reports" python:3.12-slim sh -c "pip install -q arjun >/dev/null 2>&1; arjun -u https://$TARGET -m GET -oJ /reports/arjun-raw.json -t 5 -d 1 -q"
          if has dalfox || has retirejs; then
            python3 - "$TARGET" <<'PY' || true
          import re, sys, urllib.request
          target = sys.argv[1]
          urls = []
          try: urls = [l.strip() for l in open("reports/katana-urls.txt", encoding="utf-8", errors="replace") if l.strip()]
          except OSError: pass
          js, params = [], []
          for u in urls:
              if re.search(r"\.js(\?|$)", u): js.append(u)
              if "?" in u and "=" in u: params.append(u)
          try:
              html = urllib.request.urlopen(urllib.request.Request("https://%s/" % target, headers={"User-Agent": "Taniwha"}), timeout=15).read().decode("utf-8", "replace")
              for m in re.findall(r"<script[^>]+src=[\"']([^\"']+)[\"']", html, re.I):
                  js.append(m if m.startswith("http") else ("https:" + m if m.startswith("//") else "https://%s/%s" % (target, m.lstrip("/"))))
          except Exception: pass
          open("reports/js-urls.txt", "w").write("\n".join(dict.fromkeys(js))[:20000] + "\n")
          open("reports/dalfox-urls.txt", "w").write("\n".join(dict.fromkeys(params[:50] or ["https://%s/" % target])) + "\n")
          PY
          fi
          run dalfox "Dalfox XSS-Prüfung der entdeckten Seiten mit Parametern" -v "$PWD/reports:/reports" hahwul/dalfox:latest file /reports/dalfox-urls.txt --silence --format json -o /reports/dalfox-report.json
          run retirejs "retire.js prüft die eingebundenen JavaScript-Bibliotheken auf bekannte Lücken" -v "$PWD/reports:/reports" node:20-alpine sh -c 'npm i -g retire >/dev/null 2>&1; : > /reports/retirejs-raw.jsonl; while read -r u; do [ -n "$u" ] || continue; rm -f /tmp/r.json; retire --jsuri "$u" --outputformat json --outputpath /tmp/r.json --exitwith 0 >/dev/null 2>&1; [ -s /tmp/r.json ] && echo "{\"uri\":\"$u\",\"retire\":$(cat /tmp/r.json)}" >> /reports/retirejs-raw.jsonl; done < /reports/js-urls.txt'
          run wpscan "WPScan prüft WordPress-Version, Theme und Plugins (nur passiv) auf https://$TARGET" -e WPSCAN_API_TOKEN -v "$PWD/reports:/reports" wpscanteam/wpscan --url "https://$TARGET" --no-update --random-user-agent --plugins-detection passive -e vp,vt -f json -o /reports/wpscan-raw.json
          run subfinder "Subfinder sucht Subdomains von $TARGET (passiv über öffentliche Quellen)" -v "$PWD/reports:/reports" projectdiscovery/subfinder:latest -d "$TARGET" -silent -oJ -o /reports/subfinder-raw.json
          run naabu "Naabu schneller Port-Scan (Top 1000 Ports, TCP-Connect) auf $TARGET" -v "$PWD/reports:/reports" projectdiscovery/naabu:latest -host "$TARGET" -top-ports 1000 -s c -rate 500 -silent -json -o /reports/naabu-raw.json
          run sslyze "SSLyze prüft TLS-Versionen, Cipher, Zertifikat, Heartbleed, ROBOT und Renegotiation von $TARGET" -v "$PWD/reports:/reports" python:3.12-slim sh -c "pip install -q sslyze >/dev/null 2>&1; python -m sslyze --json_out=/reports/sslyze-raw.json $TARGET"
          run whatweb "WhatWeb erkennt CMS, Frameworks, Plugins und Skripte (leise, Stufe 1) auf https://$TARGET" -v "$PWD/reports:/reports" debian:stable-slim sh -c "apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq whatweb >/dev/null 2>&1; whatweb -a 1 --log-json=/reports/whatweb-raw.json https://$TARGET"
          # Subzy: Subdomain-Takeover (nutzt Subfinder-Ergebnis, sonst nur die Hauptdomain)
          if has subzy; then
            { echo "$TARGET"; python3 -c 'import json,sys
          for l in open(sys.argv[1]):
              try: print(json.loads(l).get("host",""))
              except Exception: pass' reports/subfinder-raw.json 2>/dev/null; } | sort -u | grep . > reports/subzy-targets.txt
          fi
          run subzy "Subzy prüft $(wc -l < reports/subzy-targets.txt 2>/dev/null || echo 1) (Sub-)Domains auf Takeover-Gefahr" -v "$PWD/reports:/reports" golang:1.22-alpine sh -c "go install github.com/PentestPad/subzy@latest >/dev/null 2>&1; /go/bin/subzy run --targets /reports/subzy-targets.txt --hide_fails --https --timeout 15 --output /reports/subzy-raw.json"
          run cmseek "CMSeeK erkennt CMS (Joomla, Drupal, TYPO3 u. a.) auf https://$TARGET" -v "$PWD/reports:/reports" python:3.12-slim sh -c "apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq git >/dev/null 2>&1; git clone -q --depth 1 https://github.com/Tuhinshubhra/CMSeeK /opt/c && cd /opt/c && pip install -q -r requirements.txt >/dev/null 2>&1; python3 cmseek.py -u https://$TARGET --batch --random-agent; cp Result/*/cms.json /reports/cmseek-raw.json 2>/dev/null || true"
          # Trufflehog: Startseite + JS-Dateien herunterladen und nach geleakten Schlüsseln durchsuchen
          if has trufflehog; then
            python3 - "$TARGET" <<'PY' || true
          import os, re, sys, urllib.request
          t = sys.argv[1]; os.makedirs("reports/site", exist_ok=True)
          def get(u):
              try: return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Taniwha"}), timeout=15).read()[:3000000]
              except Exception: return b""
          home = get("https://%s/" % t); open("reports/site/index.html", "wb").write(home)
          urls = re.findall(r"<script[^>]+src=[\"']([^\"']+)[\"']", home.decode("utf-8", "replace"), re.I)
          for f in ("reports/js-urls.txt", "reports/katana-urls.txt"):
              try: urls += [l.strip() for l in open(f, encoding="utf-8", errors="replace") if re.search(r"\.js(\?|$)", l.strip())]
              except OSError: pass
          idx = []
          for i, u in enumerate(list(dict.fromkeys(urls))[:80]):
              u = u if u.startswith("http") else ("https:" + u if u.startswith("//") else "https://%s/%s" % (t, u.lstrip("/")))
              b = get(u)
              if b: open("reports/site/f%03d.js" % i, "wb").write(b); idx.append("f%03d.js\t%s" % (i, u))
          open("reports/site-index.txt", "w").write("index.html\thttps://%s/\n" % t + "\n".join(idx) + "\n")
          print("downloaded", len(idx) + 1, "files")
          PY
          fi
          run trufflehog "Trufflehog sucht geleakte Passwörter/API-Schlüssel in Startseite und JavaScript von https://$TARGET" -v "$PWD/reports:/reports" --entrypoint sh trufflesecurity/trufflehog:latest -c "trufflehog filesystem /reports/site --json --no-update > /reports/trufflehog-raw.jsonl; echo \"Treffer: \$(wc -l < /reports/trufflehog-raw.jsonl)\""
          run feroxbuster "Feroxbuster sucht versteckte Ordner/Dateien (rekursiv Tiefe 2, max. 10 min) auf https://$TARGET" -v "$PWD/reports:/reports" epi052/feroxbuster:latest -u "https://$TARGET" -w /reports/seclists-common.txt -d 2 -t 20 --auto-tune --time-limit 10m -C 404 --silent --json -o /reports/feroxbuster-raw.json
          run nmapvuln "Nmap-Schwachstellen-Skripte (vuln, Top 100 Ports, max. 20 min) auf $TARGET" -v "$PWD/reports:/reports" instrumentisto/nmap -Pn -sV --top-ports 100 --script vuln --host-timeout 20m -oX /reports/nmapvuln-raw.xml "$TARGET"
          run nmap "Nmap Port-/Service-Scan (Top 1000 Ports) auf $TARGET" instrumentisto/nmap -Pn -sV --top-ports 1000 -oX /reports/nmap-report.xml "$TARGET"
          run sqlmap "SQLMap SQL-Injection-Prüfung (Batch, sanft, Crawl Tiefe 1)" -v "$PWD/reports:/reports" parrotsec/sqlmap -u "https://$TARGET" --batch --forms --crawl=1 --crawl-depth=1 --level=1 --risk=1 --output-dir=/reports/sqlmap --flush-session
          run trivy "Trivy Abhängigkeits-/Image-Scan" -v "$PWD:/repo" -v "$PWD/reports:/reports" aquasec/trivy:latest fs --format json --output /reports/trivy-report.json /repo
          run semgrep "Semgrep Code-Analyse" -v "$PWD:/src" -v "$PWD/reports:/reports" returntocorp/semgrep:latest semgrep scan --config auto --json --output /reports/semgrep-report.json /src
          run gitleaks "Gitleaks Secret-Suche" -v "$PWD:/repo" -v "$PWD/reports:/reports" zricethezav/gitleaks:latest detect --source /repo --report-format json --report-path /reports/gitleaks-report.json
          run depcheck "OWASP Dependency-Check" -v "$PWD:/src" -v "$PWD/reports:/reports" owasp/dependency-check:latest --project App --scan /src --format JSON --out /reports
          run syft "Syft SBOM-Katalog (Workspace)" --user root -v "$PWD:/repo" -v "$PWD/reports:/reports" anchore/syft:latest dir:/repo -o syft-json=/reports/syft-report.json
          # OpenVAS (Greenbone) – läuft als dauerhafter Container "openvas"; Feeds werden beim ersten Start geladen (30–60 min)
          if has openvas; then
            OV_PW="${OPENVAS_PASSWORD:-taniwha-openvas-local}"
            gmp() { docker exec -u gvmd openvas gvm-cli --gmp-username admin --gmp-password "$OV_PW" socket --socketpath /run/gvmd/gvmd.sock --xml "$1"; }
            id_of() { grep -o 'id="[^"]*"' | head -1 | cut -d'"' -f2; }
            s=$SECONDS
            ev openvas info "Startet: OpenVAS-Vollscan (Greenbone) auf $TARGET"
            if ! docker ps -a --format '{{.Names}}' | grep -qx openvas; then
              ev openvas info "Erster Start: OpenVAS-Container wird angelegt (lädt Schwachstellen-Feeds, kann 30–60 min dauern)"
              docker run -d --name openvas --restart unless-stopped -p 127.0.0.1:9392:9392 -e PASSWORD="$OV_PW" -v openvas-data:/data immauss/openvas:latest >/dev/null || ev openvas warn "OpenVAS-Container konnte nicht gestartet werden"
            else
              docker start openvas >/dev/null 2>&1 || true
            fi
            ready=0
            for i in $(seq 1 540); do
              if gmp "<get_configs config_id='daba56c8-73ec-11df-a475-002264764cea'/>" 2>/dev/null | grep -q 'status="200"'; then ready=1; break; fi
              [ $((i % 30)) -eq 0 ] && ev openvas info "Wartet auf OpenVAS-Feeds ($((i/6)) min) …"
              sleep 10
            done
            if [ "$ready" -ne 1 ]; then
              ev openvas warn "OpenVAS wurde in 90 min nicht bereit – übersprungen (Feeds laden noch; beim nächsten Scan erneut versuchen)"
            else
              tgt=$(gmp "<create_target><name>T-$SCAN_ID</name><hosts>$TARGET</hosts><port_list id='33d0cd82-57c6-11e1-8ed1-406186ea4fc5'/></create_target>" | id_of)
              tsk=$(gmp "<create_task><name>S-$SCAN_ID</name><config id='daba56c8-73ec-11df-a475-002264764cea'/><target id='$tgt'/><scanner id='08b69003-5fc2-4037-a479-93b440211c73'/></create_task>" | id_of)
              echo "$tsk" > reports/openvas-task-id
              rid=$(gmp "<start_task task_id='$tsk'/>" | sed -n 's:.*<report_id>\([^<]*\)</report_id>.*:\1:p' | head -1)
              if [ -z "$tsk" ] || [ -z "$rid" ]; then
                ev openvas warn "OpenVAS-Aufgabe konnte nicht gestartet werden"
              else
                ev openvas info "OpenVAS-Scan läuft (Task $tsk) – prüft alle 30 s den Fortschritt"
                state=""
                for i in $(seq 1 240); do
                  state=$(gmp "<get_tasks task_id='$tsk'/>" | sed -n 's:.*<status>\([^<]*\)</status>.*:\1:p' | head -1)
                  prog=$(gmp "<get_tasks task_id='$tsk'/>" | sed -n 's:.*<progress>\([^<]*\)</progress>.*:\1:p' | head -1)
                  [ $((i % 10)) -eq 0 ] && ev openvas info "OpenVAS: Status $state, Fortschritt ${prog:-?} %"
                  case "$state" in Done|Stopped|Interrupted) break;; esac
                  sleep 30
                done
                gmp "<get_reports report_id='$rid' format_id='a994b278-1f62-11e1-96ac-406186ea4fc5' details='1' ignore_pagination='1' filter='levels=hmlg rows=-1 min_qod=30'/>" > reports/openvas-report.xml || true
                ev openvas ok "OpenVAS beendet (Status $state) nach $((SECONDS-s)) s"
              fi
            fi
          fi
          ev "" info "Alle Tools durchgelaufen – sende Reports"

      # Runs also after a cancel from Taniwha: stop leftover containers, then hand in whatever was produced so far.
      - name: Stop leftover containers
        if: always()
        run: |
          ids=$(docker ps -q --filter "name=taniwha-$SCAN_ID-")
          [ -n "$ids" ] && docker rm -f $ids || true
          # OpenVAS-Task bei Abbruch stoppen (der Container selbst bleibt bestehen)
          if [ -s reports/openvas-task-id ]; then
            docker exec -u gvmd openvas gvm-cli --gmp-username admin --gmp-password "${OPENVAS_PASSWORD:-taniwha-openvas-local}" socket --socketpath /run/gvmd/gvmd.sock --xml "<stop_task task_id='$(cat reports/openvas-task-id)'/>" >/dev/null 2>&1 || true
          fi

      - name: Convert nmap/sqlmap reports to JSON
        if: always()
        run: |
          command -v python3 >/dev/null 2>&1 || { echo "python3 fehlt – Konvertierung übersprungen"; exit 0; }
          python3 - <<'PYEOF'
          import glob, json, re
          import xml.etree.ElementTree as ET
          nmap_findings = []
          sqlmap_findings = []
          try:
              root = ET.parse("reports/nmap-report.xml").getroot()
              for host in root.iter("host"):
                  addr = host.find("address")
                  ip = addr.get("addr") if addr is not None else ""
                  for port in host.iter("port"):
                      st = port.find("state")
                      if st is None or st.get("state") != "open":
                          continue
                      svc = port.find("service")
                      name = (svc.get("name") if svc is not None else "") or "unknown"
                      ver = " ".join(filter(None, [(svc.get(a) if svc is not None else "") for a in ("product", "version", "extrainfo")]))
                      nmap_findings.append({
                          "title": "Offener Port %s/%s (%s)" % (port.get("portid"), port.get("protocol"), name),
                          "description": "Host %s: %s" % (ip, ver or name),
                          "severity": "info",
                          "url": "%s:%s" % (ip, port.get("portid")),
                      })
          except Exception:
              pass
          pat = re.compile(r"parameter '([^']+)' .*(injectable|vulnerable|injected)", re.I)
          for log in glob.glob("reports/sqlmap/**/log", recursive=True):
              try:
                  with open(log, encoding="utf-8", errors="replace") as fh:
                      for line in fh:
                          m = pat.search(line)
                          if m:
                              sqlmap_findings.append({
                                  "title": "SQL-Injection: Parameter '%s' (SQLMap)" % m.group(1),
                                  "description": line.strip()[:500],
                                  "severity": "critical",
                              })
              except Exception:
                  pass
          ov_findings = []
          try:
              oroot = ET.parse("reports/openvas-report.xml").getroot()
              for res in oroot.iter("result"):
                  if res.find("name") is None:
                      continue
                  def tx(el, tag):
                      e = el.find(tag)
                      return (e.text or "").strip() if e is not None and e.text else ""
                  try:
                      sev_n = float(tx(res, "severity") or 0)
                  except ValueError:
                      sev_n = 0.0
                  sev = "critical" if sev_n >= 9 else "high" if sev_n >= 7 else "medium" if sev_n >= 4 else "low" if sev_n > 0 else "info"
                  host = tx(res, "host")
                  port = tx(res, "port")
                  ov_findings.append({
                      "title": "%s (OpenVAS)" % tx(res, "name"),
                      "description": (tx(res, "description") or tx(res, "threat"))[:1500],
                      "severity": sev,
                      "url": ("%s %s" % (host, port)).strip(),
                  })
          except Exception:
              pass
          if ov_findings:
              with open("reports/openvas-report.json", "w") as fh:
                  json.dump({"findings": ov_findings}, fh)
              print("converted %d openvas findings" % len(ov_findings))
          if nmap_findings:
              with open("reports/nmap-report.json", "w") as fh:
                  json.dump({"findings": nmap_findings}, fh)
              print("converted %d nmap findings" % len(nmap_findings))
          if sqlmap_findings:
              with open("reports/sqlmap-report.json", "w") as fh:
                  json.dump({"findings": sqlmap_findings}, fh)
              print("converted %d sqlmap findings" % len(sqlmap_findings))
